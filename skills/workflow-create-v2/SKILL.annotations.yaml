init_user_intent:
  type: FnNode
  id: init_user_intent
  command: python3 -c "from factory.workflow.contributed.create_v2.intent_init import
    main; main()" "{project_path}"
  reads: []
  writes:
  - .factory/strategy/user-intent.md
  edges_out:
  - target: gate_has_factory
    condition: null
gate_has_factory:
  type: GateNode
  id: gate_has_factory
  evaluator_type: fn
  evaluator_command: python3 -c "from pathlib import Path; exists = Path("{project_path}/.factory/config.json").exists();
    print("PROCEED" if exists else "HALT")"
  reads: []
  edges_out:
  - target: graph_update
    condition: PROCEED
  - target: discover
    condition: HALT
discover:
  type: FnNode
  id: discover
  command: factory discover {project_path}
  reads: []
  writes:
  - .factory/eval_profile.json
  edges_out:
  - target: gate_factory_md_exists
    condition: null
gate_factory_md_exists:
  type: GateNode
  id: gate_factory_md_exists
  evaluator_type: fn
  evaluator_command: python3 -c "from pathlib import Path; exists = Path("{project_path}/factory.md").exists();
    print("PROCEED" if exists else "HALT")"
  reads: []
  edges_out:
  - target: factory_init
    condition: PROCEED
  - target: create_factory_md
    condition: HALT
create_factory_md:
  type: AgentNode
  id: create_factory_md
  role: ceo
  blocking: 'true'
  reads:
  - .factory/eval_profile.json
  writes:
  - factory.md
  edges_out:
  - target: factory_init
    condition: null
  slots:
    task_prompt_create_factory_md: 'Create factory.md from template. Copy the factory
      config template to the project root. Fill in: Goal, Scope, Guards, Eval command,
      Threshold, and Smoke Test. If .factory/eval_spec.json exists, populate the Eval
      Spec section. If .factory/strategy/current.md has a Research Configuration section,
      populate research sections (Research Target, Mutable/Fixed Surfaces, etc.).

      Read: .factory/eval_profile.json

      Write output to: factory.md'
    timeout_create_factory_md: '3600'
factory_init:
  type: FnNode
  id: factory_init
  command: factory init {project_path}
  reads:
  - factory.md
  writes:
  - .factory/config.json
  edges_out:
  - target: graph_update
    condition: null
graph_update:
  type: FnNode
  id: graph_update
  command: factory graph update {project_path}
  reads: []
  writes:
  - graph.json
  edges_out:
  - target: study
    condition: null
study:
  type: Study
  id: study
  command: factory study {project_path}
  writes:
  - .factory/strategy/observations.md
  edges_out:
  - target: graph_explorer
    condition: null
graph_explorer:
  type: AgentNode
  id: graph_explorer
  role: researcher
  blocking: 'true'
  reads:
  - .factory/strategy/observations.md
  writes:
  - .factory/strategy/graph-context.md
  edges_out:
  - target: concat_study
    condition: null
  slots:
    task_prompt_graph_explorer: 'Explore the project''s code knowledge graph to build
      structural understanding. Read .factory/strategy/observations.md for focus context.


      **Step 0 — detect graph availability:** Your working directory is already the
      project root. The graph file lives at `$PROJECT_PATH/graph.json` (NOT inside
      `.factory/`). Run this smoke check FIRST — use a relative path since your CWD
      is the project root: `test -f graph.json && echo ''GRAPH AVAILABLE'' || echo
      ''NO GRAPH''` — if the output says GRAPH AVAILABLE, proceed with the graph commands
      below. If the output says NO GRAPH, skip to the fallback section.


      **If the graph IS available:**

      1. Run `factory graph query "$PROJECT_PATH" "<focus from observations>" --depth
      2` to find relevant nodes

      2. Run `factory graph explain "$PROJECT_PATH" "<key node>"` on the most important
      nodes to understand their connections and dependencies

      3. Run `factory graph path "$PROJECT_PATH" "<A>" "<B>"` to trace dependency
      paths between key components

      4. Write structured findings to .factory/strategy/graph-context.md covering:
      key modules and their relationships, dependency paths, architectural layers,
      entry points and hotspots


      **If the graph is NOT available**, fall back to direct file exploration:

      1. Use `find . -name ''*.py'' | head -50` to discover source files

      2. Use `grep -rn ''class \|def '' --include=''*.py'' | head -100` to map functions
      and classes

      3. Use `grep -rn ''import '' --include=''*.py'' | head -100` to trace dependencies

      4. Write the same structured findings to .factory/strategy/graph-context.md

      Read: .factory/strategy/observations.md

      Write output to: .factory/strategy/graph-context.md'
    timeout_graph_explorer: '600'
concat_study:
  type: FnNode
  id: concat_study
  command: cat {project_path}/.factory/strategy/observations.md {project_path}/.factory/strategy/graph-context.md
    > {project_path}/.factory/strategy/study-combined.md
  reads:
  - .factory/strategy/graph-context.md
  - .factory/strategy/observations.md
  writes:
  - .factory/strategy/study-combined.md
  edges_out:
  - target: research_director
    condition: null
research_director:
  type: AgentNode
  id: research_director
  role: ceo
  blocking: 'true'
  reads:
  - .factory/strategy/study-combined.md
  - .factory/strategy/user-intent.md
  writes:
  - .factory/strategy/research-plan.json
  edges_out:
  - target: strategy_director
    condition: null
  slots:
    task_prompt_research_director: "You are the Research Director for this workflow\
      \ creation session.\n\nRead:\n- `.factory/strategy/study-combined.md` — project\
      \ study findings (observations + graph analysis)\n- `.factory/strategy/user-intent.md`\
      \ — the user's original mode description\n\nYour task has TWO phases:\n\nPHASE\
      \ 1 — DESIGN RESEARCH DIRECTIONS\nAnalyze the mode description and identify\
      \ N orthogonal research dimensions\ntailored to workflow construction.\n\nDefault\
      \ dimensions (adapt or replace based on the specific mode):\n  - Existing workflow\
      \ patterns — study `factory/workflow/definitions.py`,\n    `factory/workflow/primitives.py`,\
      \ and contributed workflows to understand\n    node types, edge conventions,\
      \ fork/join patterns, and trigger functions\n  - Mode purpose and agent requirements\
      \ — what agents does this mode need,\n    what data flows between them, what\
      \ gates control quality\n  - Workflow design best practices — DAG patterns,\
      \ quality gate strategies,\n    error recovery, reads/writes declarations\n\n\
      You may add dimensions specific to the mode:\n  - Integration patterns (for\
      \ modes that interact with external tools)\n  - Security and safety (for modes\
      \ that run untrusted code)\n  - Performance and scaling (for modes with parallel\
      \ execution)\n\nN is NOT fixed — YOU decide based on mode complexity:\n  - Simple\
      \ mode (single-agent pipeline): 3 directions\n  - Medium mode (fork/join, 2-3\
      \ agents): 4-5 directions\n  - Complex mode (multi-stage, directors, overwatch):\
      \ 5-7 directions\n\nFor each direction, design a TAILORED prompt — not a generic\
      \ template.\nBad: \"Research existing workflow patterns\"\nGood: \"Study the\
      \ create_workflow() and design-v2 workflow to understand how\n       the inherit-and-mutate\
      \ pattern works: how nodes are added/removed/modified,\n       how edges are\
      \ filtered and extended, and how validate_graph() catches\n       wiring errors.\
      \ Document the exact mutation sequence and common pitfalls.\"\n\nWrite the research\
      \ plan to `.factory/strategy/research-plan.json`:\n```json\n[\n  {\"focus\"\
      : \"...\", \"slug\": \"...\", \"prompt\": \"...\"}\n]\n```\n\nConstraints:\n\
      - Minimum 3 directions, maximum 7\n- Each slug must be unique and kebab-case\n\
      - Prompts must be specific to THIS mode, not generic templates\n\nPHASE 2 —\
      \ EXECUTE RESEARCH\nFor each direction in the plan, spawn a researcher agent:\n\
      ```\nfactory agent researcher --task \"<direction.prompt>\" --project $PROJECT_PATH\n\
      ```\n\nEach researcher writes to `.factory/strategy/research-<slug>.md`.\n\n\
      After ALL researchers complete, review quality:\n- Each research file exists\
      \ and has substantive content (>50 bytes)\n- No two reports cover the same ground\
      \ excessively\n- Key workflow patterns and node types are covered\n\nIf a researcher\
      \ produced thin output, re-invoke it with a more specific prompt.\n\nWrite a\
      \ brief research summary to the end of research-plan.json noting\nwhich directions\
      \ completed and any quality issues.\nRead: .factory/strategy/study-combined.md,\
      \ .factory/strategy/user-intent.md\nWrite output to: .factory/strategy/research-plan.json"
    timeout_research_director: '3600'
strategy_director:
  type: AgentNode
  id: strategy_director
  role: ceo
  blocking: 'true'
  reads:
  - .factory/strategy/research-plan.json
  - .factory/strategy/study-combined.md
  - .factory/strategy/user-intent.md
  writes:
  - .factory/strategy/strategy-plan.json
  edges_out:
  - target: synthesize_strategy
    condition: null
  slots:
    task_prompt_strategy_director: "You are the Strategy Director for this workflow\
      \ creation session.\n\nRead:\n- ALL research reports at `.factory/strategy/research-*.md`\n\
      - `.factory/strategy/research-plan.json` — which research directions were explored\n\
      - `.factory/strategy/user-intent.md` — the user's original mode description\n\
      - `.factory/strategy/study-combined.md` — project context\n\nYour task has TWO\
      \ phases:\n\nPHASE 1 — DESIGN STRATEGY PERSPECTIVES\nAnalyze the research findings\
      \ and user intent to identify M strategy\nperspectives for the workflow specification.\n\
      \nDefault perspectives (adapt or replace based on the specific mode):\n  - Architecture\
      \ strategy — graph topology, node types, edge wiring,\n    fork/join patterns,\
      \ gate logic, data flow\n  - Testing/verification strategy — acceptance criteria,\
      \ test cases,\n    graph validation, SKILL.md generation, CLI integration checks\n\
      \  - Risk/scope strategy — what to include vs defer, complexity budget,\n  \
      \  mutation ordering, edge case handling\n\nYou may add perspectives specific\
      \ to the mode:\n  - Prompt design strategy (for modes with complex agent prompts)\n\
      \  - Integration strategy (for modes that bridge external systems)\n  - Migration\
      \ strategy (for modes that replace existing workflows)\n\nM is NOT fixed — YOU\
      \ decide based on mode complexity:\n  - Simple mode: 2-3 perspectives\n  - Medium\
      \ mode: 3-4 perspectives\n  - Complex mode: 4-5 perspectives\n\nFor each perspective,\
      \ design a TAILORED prompt.\nBad: \"Create an architecture strategy for the\
      \ workflow\"\nGood: \"Design the graph topology for the new mode. The mode needs\
      \ a\n       research director (CEO, 3600s) that dynamically spawns N researchers,\n\
      \       a strategy director that produces workflow specs with intent fidelity\n\
      \       checks, and an overwatch for final verification. Use the inherit-and-mutate\n\
      \       pattern from design-v2: call create_workflow() as the base, add new\
      \ nodes,\n       remove obsolete ones, rewire edges. Specify exact node IDs,\
      \ types, roles,\n       reads/writes, and edge conditions.\"\n\nWrite the strategy\
      \ plan to `.factory/strategy/strategy-plan.json`:\n```json\n[\n  {\"perspective\"\
      : \"...\", \"slug\": \"...\", \"prompt\": \"...\"}\n]\n```\n\nConstraints:\n\
      - Minimum 2 perspectives, maximum 5\n- Each slug must be unique and kebab-case\n\
      - One perspective MUST cover testing/verification with explicit acceptance criteria\n\
      - Prompts must reference specific findings from the research reports\n\nINTENT\
      \ FIDELITY CHECK (MANDATORY before spawning strategists):\nBefore writing the\
      \ strategy plan, extract every distinct ask from\nuser-intent.md — features,\
      \ constraints, behaviors, requirements the user\nmentioned. Write them as an\
      \ `\"intent_items\"` array in strategy-plan.json.\nThen verify: does at least\
      \ one perspective's prompt cover each intent item?\nIf an intent item is not\
      \ addressed by any perspective, either add a\nperspective or expand an existing\
      \ prompt to cover it. No user ask may be\nsilently dropped.\n\nEach strategist\
      \ prompt MUST include this line at the end:\n\"IMPORTANT: The user specifically\
      \ asked for: <list the intent items relevant\nto this perspective>. Your strategy\
      \ MUST address each of these. Do not\nsubstitute your own ideas for what the\
      \ user asked for.\"\n\nPHASE 2 — EXECUTE STRATEGIES\nFor each perspective in\
      \ the plan, spawn a strategist agent:\n```\nfactory agent strategist --task\
      \ \"<perspective.prompt>\" --project $PROJECT_PATH\n```\n\nEach strategist writes\
      \ to `.factory/strategy/strategy-<slug>.md`.\n\nAfter ALL strategists complete,\
      \ review quality:\n- Each strategy file exists and has substantive content (>100\
      \ bytes)\n- The testing strategy has a `### Acceptance Criteria` section with\
      \ checkboxes\n- Architecture strategy specifies concrete node IDs, types, and\
      \ edge wiring\n- No critical perspective is missing\n- INTENT COVERAGE: re-read\
      \ user-intent.md and verify every user ask appears\n  in at least one strategy\
      \ output. If a strategist dropped an intent item,\n  re-invoke it with explicit\
      \ instructions to address the missing item.\n\nIf a strategist produced thin\
      \ output, re-invoke it with a more specific prompt.\n\nWrite a brief strategy\
      \ summary to the end of strategy-plan.json noting\nwhich perspectives completed,\
      \ intent coverage status, and any quality issues.\nRead: .factory/strategy/research-plan.json,\
      \ .factory/strategy/study-combined.md, .factory/strategy/user-intent.md\nWrite\
      \ output to: .factory/strategy/strategy-plan.json"
    timeout_strategy_director: '3600'
synthesize_strategy:
  type: AgentNode
  id: synthesize_strategy
  role: strategist
  blocking: 'true'
  reads:
  - .factory/strategy/strategy-plan.json
  - .factory/strategy/user-intent.md
  writes:
  - .factory/strategy/current.md
  edges_out:
  - target: gate_strategy
    condition: null
  slots:
    task_prompt_synthesize_strategy: "You are the Strategy Synthesizer. Compile one\
      \ final workflow specification\nfrom all strategy inputs. Your primary obligation\
      \ is FIDELITY TO USER INTENT —\nthe spec must capture everything the user asked\
      \ for.\n\nRead:\n- `.factory/strategy/user-intent.md` — ground truth for user's\
      \ ask (READ THIS FIRST)\n- ALL strategy files at `.factory/strategy/strategy-*.md`\n\
      - `.factory/strategy/strategy-plan.json` — which perspectives were explored,\n\
      \  including the `intent_items` array listing every user ask\n\nSTEP 1 — INTENT\
      \ EXTRACTION\nBefore synthesizing, extract every distinct ask from user-intent.md\
      \ into a\nnumbered list. These are the user's requirements. Every single one\
      \ must\nappear in the final spec — either as a feature in the phased plan, an\n\
      acceptance criterion, or an explicitly deferred item with rationale.\n\nSTEP\
      \ 2 — SYNTHESIZE\nWrite the final workflow specification to `.factory/strategy/current.md`.\n\
      \nRequired sections (in this order):\n### Graph Topology\n  The complete DAG:\
      \ every node ID, type, edges with conditions.\n  Use a text-based diagram showing\
      \ the flow.\n### Node Definitions\n  For each node: id, type (AgentNode/FnNode/GateNode/ForkNode/JoinNode),\n\
      \  role (if AgentNode), timeout, reads, writes, post_checks, prompt summary.\n\
      ### Edge Wiring\n  Complete edge list: source → target [condition].\n  Highlight\
      \ RELOOP back-edges and their gate conditions.\n### Phased Plan\n  #### Phase\
      \ 1: <name>\n  - **What:** <specific implementation steps>\n  - **Why:** <rationale>\n\
      \  - **Acceptance criteria:** <testable criteria>\n### Acceptance Criteria\n\
      \  Full checklist. Each item must be:\n  - [ ] Specific enough for pass/fail\
      \ verification\n  - Traceable to user intent (cite which part of user-intent.md)\n\
      ### MVP Scope\n  In vs deferred.\n### Deferred Features\n  Items explicitly\
      \ deferred with rationale.\n\nSTEP 3 — INTENT COVERAGE AUDIT\nAfter writing\
      \ current.md, go back to your numbered intent list from Step 1.\nFor each user\
      \ ask, verify it appears in the spec:\n- In the graph topology as a node or\
      \ edge, OR\n- In acceptance criteria as a testable item, OR\n- In deferred features\
      \ with a rationale for why it's deferred\n\nWrite a `### Intent Coverage` section\
      \ at the end of current.md:\n| # | User Ask | Where in Plan | Status |\n|---|----------|--------------|--------|\n\
      | 1 | <ask> | Node X / Criterion Y / Deferred | Covered / Deferred |\n\nIf ANY\
      \ user ask has status \"Missing\" — you have failed. Go back and add it\nto\
      \ the appropriate section before finalizing. No user ask may be silently\ndropped.\n\
      \nCRITICAL: The ### Acceptance Criteria section is the contract between\nthe\
      \ builder and QA. It flows to the QA Director who verifies each\ncriterion with\
      \ workflow-specific tests. Make every item testable and unambiguous.\nRead:\
      \ .factory/strategy/strategy-plan.json, .factory/strategy/user-intent.md\nWrite\
      \ output to: .factory/strategy/current.md"
    timeout_synthesize_strategy: '600'
gate_strategy:
  type: GateNode
  id: gate_strategy
  evaluator_type: user
  reads:
  - .factory/strategy/current.md
  - .factory/strategy/user-intent.md
  edges_out:
  - target: archivist_plan
    condition: PROCEED
  - target: strategy_director
    condition: RELOOP
  slots:
    max_iterations_gate_strategy: '3'
archivist_plan:
  type: AgentNode
  id: archivist_plan
  role: archivist
  blocking: 'false'
  reads:
  - .factory/strategy/current.md
  writes:
  - .factory/archive/create-plan.md
  edges_out:
  - target: builder
    condition: null
  slots:
    task_prompt_archivist_plan: 'Archive the approved workflow specification for the
      new mode.

      Read: .factory/strategy/current.md

      Write output to: .factory/archive/create-plan.md'
    timeout_archivist_plan: '300'
builder:
  type: AgentNode
  id: builder
  role: builder
  blocking: 'true'
  reads:
  - .factory/strategy/current.md
  writes:
  - .factory/reviews/builder-latest.md
  edges_out:
  - target: gate_build
    condition: null
  slots:
    task_prompt_builder: 'Implement the workflow changes from the approved specification.
      Read the approved spec at .factory/strategy/current.md. Read CLAUDE.md for project
      conventions. If the CEO task includes ''## Create Mode (Plugin Package)'', follow
      the PLUGIN checklist: 1) Read **output_folder** from the CEO task 2) Create
      the output directory: mkdir -p <output_folder> 3) Write pyproject.toml with:    name
      factory-<mode-name>-workflow, version 0.1.0,    build-system hatchling, requires-python
      >=3.11,    dependencies [remote-factory],    entry point [factory.plugins] <mode-name>
      = ''<mode_name>:register_plugin'' 4) Write <mode_name>.py with:    meta dict
      (name, description),    workflow() function returning a Workflow object,    register_plugin(registry)
      calling registry.add_modes() and    registry.add_workflow_search_path(str(Path(__file__).parent))
      5) Write README.md with installation and usage 6) Test: pip install -e <output_folder>/
      7) Verify: factory workflow list shows the mode 8) Validate: factory workflow
      validate <mode-name> 9) Clean up: pip uninstall -y factory-<mode-name>-workflow
      The plugin package stays in the output directory — do NOT commit it to the factory
      repo or open a PR. It is a standalone artifact. Do NOT modify factory/workflow/definitions.py
      or register_all(). Otherwise, if the CEO task includes ''## Create Mode (Update
      Existing Mode)'', follow the update checklist: modify the existing workflow
      function in definitions.py, verify the register_all() entry still resolves,
      update WORKFLOW_META if needed, verify all 20 registration points from the CEO
      task, run factory workflow validate <name>, regenerate SKILL.md via factory
      workflow export-skills, update tests, run pytest and ruff check. Otherwise,
      follow the new-mode checklist for portable workflows: 1) Create $PROJECT_PATH/.factory/workflows/
      directory if it doesn''t exist 2) Write the workflow file to $PROJECT_PATH/.factory/workflows/<name>.py
      3) The file must contain a `meta` dict with `name` and `description` keys, and
      a `workflow()` function returning a Workflow object 4) Only import from factory.workflow.primitives
      and stdlib — no other factory internals 5) Do NOT modify factory/workflow/definitions.py,
      register_all(), WORKFLOW_META, or CLI wiring — the workflow registry discovers
      .factory/workflows/ automatically 6) Run factory workflow validate <name> --project-path
      $PROJECT_PATH to verify the graph 7) Run factory workflow export-skills --project-path
      $PROJECT_PATH to generate the SKILL.md 8) Write tests in tests/ 9) Run pytest
      and ruff check to verify Commit changes and open a draft PR.

      Read: .factory/strategy/current.md

      Write output to: .factory/reviews/builder-latest.md'
    timeout_builder: '1800'
gate_build:
  type: GateNode
  id: gate_build
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - .factory/reviews/builder-latest.md
  edges_out:
  - target: fork_qa
    condition: PROCEED
  - target: builder
    condition: RELOOP
  slots:
    gate_prompt_gate_build: 'Read builder output and PR diff. Does work match the
      approved spec? For plugin packages: verify output directory contains pyproject.toml,
      workflow .py with meta + workflow() + register_plugin(), and README.md. Verify
      NO upstream factory files were modified. For new modes: verify workflow file
      exists at .factory/workflows/<name>.py with meta dict and workflow() function,
      NOT patched into definitions.py. For existing mode updates: verify definitions.py
      changes are correct. Tests written. REDIRECT if any component is missing.'
    max_iterations_gate_build: '3'
fork_qa:
  type: ForkNode
  id: fork_qa
  targets: health_checker,code_reviewer,qa_director
  edges_out:
  - target: join_qa
    condition: null
health_checker:
  type: AgentNode
  id: health_checker
  role: health_checker
  blocking: 'true'
  reads:
  - .factory/reviews/builder-latest.md
  - .factory/strategy/current.md
  writes:
  - .factory/reviews/health-check.md
  edges_out: []
  slots:
    task_prompt_health_checker: 'Execute health_checker task for the project.

      Read: .factory/reviews/builder-latest.md, .factory/strategy/current.md

      Write output to: .factory/reviews/health-check.md'
    timeout_health_checker: '600'
code_reviewer:
  type: AgentNode
  id: code_reviewer
  role: code_reviewer
  blocking: 'true'
  reads:
  - .factory/reviews/builder-latest.md
  - .factory/strategy/current.md
  writes:
  - .factory/reviews/code-review.md
  edges_out: []
  slots:
    task_prompt_code_reviewer: 'Execute code_reviewer task for the project.

      Read: .factory/reviews/builder-latest.md, .factory/strategy/current.md

      Write output to: .factory/reviews/code-review.md'
    timeout_code_reviewer: '900'
qa_director:
  type: AgentNode
  id: qa_director
  role: ceo
  blocking: 'true'
  reads:
  - .factory/reviews/builder-latest.md
  - .factory/strategy/current.md
  - .factory/strategy/user-intent.md
  writes:
  - .factory/reviews/qa-plan.json
  edges_out: []
  slots:
    task_prompt_qa_director: "You are the QA Director for this workflow creation session.\n\
      \nRead:\n- `.factory/strategy/current.md` — the workflow specification with\
      \ acceptance criteria\n- `.factory/strategy/user-intent.md` — what the user\
      \ ACTUALLY asked for\n- `.factory/reviews/builder-latest.md` — what the builder\
      \ implemented\n\nYour task has THREE phases:\n\nPHASE 1 — DESIGN QA APPROACHES\n\
      Analyze the acceptance criteria, the user's intent, and the builder's\nimplementation\
      \ to identify K orthogonal testing approaches tailored to\nworkflow construction.\n\
      \nDefault approaches (adapt or replace based on the workflow):\n  - Graph structure\
      \ verification — node count, edge count, node types,\n    fork/join target/source\
      \ matching, gate evaluator types\n  - Prompt and data flow verification — reads/writes\
      \ declarations,\n    post_checks, prompt content, artifact paths\n  - User intent\
      \ verification — does the workflow implement what the user\n    asked for, not\
      \ just what the spec says?\n\nYou may add approaches specific to the workflow:\n\
      \  - Registration testing (verify mode appears in CLI, registry, SKILL.md)\n\
      \  - Inheritance testing (verify base workflow mutations are correct)\n  - Edge\
      \ case testing (missing nodes, dangling edges, circular paths)\n\nK is NOT fixed\
      \ — YOU decide based on the complexity of the workflow:\n  - Simple workflow\
      \ (3-10 nodes): 2 testers\n  - Medium workflow (10-20 nodes): 3 testers\n  -\
      \ Complex workflow (20+ nodes): 4-5 testers\n\nFor each approach, design a TAILORED\
      \ prompt.\nBad: \"Test the workflow implementation\"\nGood: \"Verify the create-v2\
      \ workflow graph structure: check that fork_qa.targets\n       equals join_qa.sources\
      \ equals ['health_checker', 'code_reviewer', 'qa_director'],\n       verify\
      \ gate_strategy is evaluator_type='user', verify gate_overwatch is\n       evaluator_type='agent'\
      \ with evaluator_role=CEO, check that both archivists\n       have blocking=False.\"\
      \n\nWrite the QA plan to `.factory/reviews/qa-plan.json`:\n```json\n[\n  {\"\
      approach\": \"...\", \"slug\": \"...\", \"prompt\": \"...\"}\n]\n```\n\nConstraints:\n\
      - Minimum 2 approaches, maximum 5\n- Each slug must be unique and kebab-case\n\
      - ALL acceptance criteria from current.md must be covered by at least\n  one\
      \ tester's prompt\n- Prompts must reference specific node IDs, edge conditions,\
      \ and acceptance criteria\n\nMANDATORY WORKFLOW-SPECIFIC TESTERS (hardcoded\
      \ — always include these):\nIn addition to your K designed approaches, you MUST\
      \ always include these\ntwo hardcoded testers. These are non-negotiable.\n\n\
      1. slug: \"workflow-validate\"\n   Prompt: \"You are a workflow validation tester.\
      \ Your ONLY job: run the\n   built workflow through the factory's validation\
      \ pipeline.\n   Run these commands and report exact output:\n   1. `factory\
      \ workflow validate <mode-name>` — the graph must validate\n      with zero\
      \ issues\n   2. `factory workflow show <mode-name>` — verify node count and\
      \ edge count\n      match the specification\n   3. Import the workflow in Python\
      \ and call validate_graph() directly —\n      verify it returns an empty list\n\
      \   If any command fails or returns unexpected output, that is your finding.\"\
      \n\n2. slug: \"cli-integration\"\n   Prompt: \"You are a CLI integration tester.\
      \ Your ONLY job: verify the\n   new mode integrates correctly with the factory\
      \ CLI.\n   Run these commands and report exact output:\n   1. `factory workflow\
      \ list` — the mode must appear with a non-empty description\n   2. `factory\
      \ workflow show <mode-name>` — must display nodes and edges\n   3. `factory\
      \ workflow export-skills` — must generate SKILL.md for the mode\n   4. Verify\
      \ the SKILL.md file exists at skills/workflow-<mode-name>/SKILL.md\n   If any\
      \ command fails or the mode is missing from output, that is your finding.\"\n\
      \n**Plugin mode check:** If the CEO task includes '## Create Mode\n(Plugin Package)',\
      \ also include a tester that verifies the plugin package\nstructure: pyproject.toml\
      \ with entry-points, workflow .py with meta +\nworkflow() + register_plugin(),\
      \ pip install -e succeeds, factory workflow\nlist shows the mode, factory workflow\
      \ validate passes, pip uninstall cleanup.\nVerify NO upstream factory files\
      \ were modified.\n\n**Project-local mode check:** For new portable modes, include\
      \ a tester that\nverifies the workflow was written to .factory/workflows/<name>.py\
      \ (NOT to\ndefinitions.py). Run factory workflow validate <name> --project-path\
      \ $PROJECT_PATH\nand factory workflow show <name> --project-path $PROJECT_PATH.\
      \ Verify SKILL.md\ngenerated under skills/workflow-<name>/.\n\nThese mandatory\
      \ testers run alongside your K designed testers — they do NOT\ncount toward\
      \ K.\n\nPHASE 2 — EXECUTE QA (ALL IN PARALLEL)\nSpawn ALL testers in parallel:\n\
      \nFor each approach in the plan:\n```\nfactory agent adversarial_tester --review-tag\
      \ <slug> --task \"<approach.prompt>\" --project $PROJECT_PATH &\n```\n\nPlus\
      \ the 2 mandatory workflow testers (ALWAYS, non-negotiable):\n```\nfactory agent\
      \ adversarial_tester --review-tag workflow-validate --task \"<prompt>\" --project\
      \ $PROJECT_PATH &\nfactory agent adversarial_tester --review-tag cli-integration\
      \ --task \"<prompt>\" --project $PROJECT_PATH &\n```\n\nThen `wait` for all\
      \ agents to complete.\n\nEach tester writes to `.factory/reviews/adversarial-<slug>-latest.md`.\n\
      \nAfter ALL agents complete, review quality:\n- Each report exists and has substantive\
      \ findings\n- All acceptance criteria are covered by at least one tester\n-\
      \ The workflow-validate and cli-integration testers passed\n- No tester missed\
      \ its assigned focus area\n\nIf a tester produced thin output, re-invoke it\
      \ with a more specific prompt.\n\nWrite a brief QA summary to the end of qa-plan.json\
      \ noting which\napproaches completed and any quality issues.\nRead: .factory/reviews/builder-latest.md,\
      \ .factory/strategy/current.md, .factory/strategy/user-intent.md\nWrite output\
      \ to: .factory/reviews/qa-plan.json"
    timeout_qa_director: '3600'
join_qa:
  type: JoinNode
  id: join_qa
  sources: health_checker,code_reviewer,qa_director
  reads:
  - .factory/reviews/code-review.md
  - .factory/reviews/health-check.md
  - .factory/reviews/qa-plan.json
  writes: []
  edges_out:
  - target: synthesize_qa
    condition: null
synthesize_qa:
  type: FnNode
  id: synthesize_qa
  command: python3 -c "from factory.workflow.contributed.create_v2.qa_synthesis import
    main; main()" "{project_path}"
  reads:
  - .factory/reviews/code-review.md
  - .factory/reviews/health-check.md
  writes:
  - .factory/reviews/qa-synthesized.md
  edges_out:
  - target: gate_qa
    condition: null
gate_qa:
  type: GateNode
  id: gate_qa
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - .factory/reviews/qa-synthesized.md
  - .factory/strategy/user-intent.md
  edges_out:
  - target: builder
    condition: RELOOP
  - target: overwatch
    condition: PROCEED
  slots:
    gate_prompt_gate_qa: "You are the CEO reviewing QA results for a newly created\
      \ workflow.\n\nRead:\n- `.factory/strategy/user-intent.md` — what the user ACTUALLY\
      \ asked for\n- `.factory/reviews/qa-synthesized.md` — merged QA report (health\
      \ check,\n  code review, and synthesized adversarial findings)\n\nDecision framework:\n\
      \nPROCEED if ALL of these hold:\n  1. Workflow validates cleanly (`factory workflow\
      \ validate` passes)\n  2. Mode appears in `factory workflow list` with correct\
      \ description\n  3. SKILL.md was generated successfully\n  4. All acceptance\
      \ criteria from current.md are verified PASS\n  5. Health check passes (tests\
      \ green, lint clean)\n  6. No blocking code review issues\n  7. No HIGH-confidence\
      \ adversarial findings that violate user intent\n\nRELOOP to builder (max 3\
      \ iterations) if ANY of these hold:\n  1. Workflow validation fails — cite the\
      \ specific issues\n  2. Mode missing from registry or CLI\n  3. SKILL.md generation\
      \ failed\n  4. An acceptance criterion failed — cite which one\n  5. Health\
      \ check failed — cite which check\n  6. Blocking review or HIGH adversarial\
      \ findings\n\n  When relooping, provide feedback mapped to SPECIFIC user requirements:\n\
      \  - \"User asked for X (user-intent.md), but <finding from QA>\"\n  - \"Acceptance\
      \ criterion '<criterion>' FAILED: <evidence>\"\n\n  IMPORTANT: Append your reloop\
      \ feedback to .factory/strategy/user-intent.md\n  under a new '## [timestamp]\
      \ Reloop Feedback (Iteration N)' heading.\n\nHALT if:\n  - 3 reloops exhausted\
      \ without resolution\n  - Fundamental design flaw that builder iterations cannot\
      \ fix"
    max_iterations_gate_qa: '3'
overwatch:
  type: AgentNode
  id: overwatch
  role: ceo
  blocking: 'true'
  reads:
  - .factory/reviews/builder-latest.md
  - .factory/reviews/code-review.md
  - .factory/reviews/health-check.md
  - .factory/reviews/qa-synthesized.md
  - .factory/strategy/current.md
  - .factory/strategy/user-intent.md
  writes:
  - .factory/reviews/overwatch-latest.md
  edges_out:
  - target: gate_overwatch
    condition: null
  slots:
    task_prompt_overwatch: "You are the Overwatch — the final verification agent before\
      \ the workflow is shown to the user. Your job is to verify that everything the\
      \ user asked for was actually built and actually tested, with evidence.\n\n\
      You are NOT another QA pass. The QA Director's testers already checked the code.\
      \ You check the COMPLETENESS and HONESTY of the entire pipeline's output.\n\n\
      Read:\n- .factory/strategy/user-intent.md — every ask the user made\n- .factory/strategy/current.md\
      \ — the approved workflow specification\n- .factory/reviews/builder-latest.md\
      \ — what the builder claims to have done\n- .factory/reviews/qa-synthesized.md\
      \ — merged QA report\n- .factory/reviews/health-check.md — eval and test results\n\
      - .factory/reviews/code-review.md — code review findings\n\nSTEP 1 — INTENT\
      \ CHECKLIST\nExtract every distinct user ask from user-intent.md. For each:\n\
      - Is it in the workflow graph? (check node IDs, edges, prompts in current.md)\n\
      - Is there test evidence in the QA reports? (command + output, not just claims)\n\
      - Was the workflow actually validated? (look for `factory workflow validate`\
      \ output)\n\nSTEP 2 — EVIDENCE AUDIT\nRead each QA report. For every PASS claim,\
      \ check:\n- Does it show the actual command that was run?\n- Does it show the\
      \ actual output?\n- Or is it just \"verified — PASS\" with no evidence?\nFlag\
      \ every unsupported claim.\n\nSTEP 3 — SPOT CHECK (MANDATORY)\nRun these concrete\
      \ validation commands yourself:\n1. `factory workflow validate <mode-name>`\
      \ — the graph must validate cleanly\n2. Check SKILL.md existence — `ls skills/workflow-<mode-name>/SKILL.md`\n\
      3. `factory workflow list` — the mode must appear in the registry\n4. Reads/writes\
      \ consistency — every file a node reads must be written by\n   a predecessor\
      \ node in the graph. Check the node definitions in current.md.\n5. Workflow\
      \ execution check — import the workflow in Python and verify\n   validate_graph()\
      \ returns an empty list\n\nShow your commands and their output as evidence.\n\
      \nCommon agent pitfalls to check for:\n- Workflow validates but is missing nodes\
      \ from the specification\n- SKILL.md was generated but the mode doesn't appear\
      \ in `factory workflow list`\n- Tests pass but don't actually test the workflow\
      \ graph structure\n- Node reads a file that no predecessor writes\n- Gate has\
      \ wrong evaluator_type (user vs agent)\n- Fork targets don't match join sources\n\
      - Edges reference removed nodes\n\nSTEP 4 — REPORT\nWrite a structured report\
      \ to .factory/reviews/overwatch-latest.md:\n\n# Overwatch Verification Report\n\
      \n## Intent Coverage\n| # | User Ask | Built? | Tested? | Evidence? | Status\
      \ |\n|---|----------|--------|---------|-----------|--------|\n\n## Evidence\
      \ Audit\n- Claims with evidence: N\n- Claims without evidence: M\n- [list unsupported\
      \ claims]\n\n## Spot Check Results\n### Check 1: workflow validate\n- Command:\
      \ <what you ran>\n- Output: <what happened>\n- Verdict: PASS/FAIL\n\n### Check\
      \ 2: SKILL.md existence\n...\n\n## Verdict\nPASS — all user asks verified with\
      \ evidence\nFAIL — [list what's missing or unsupported]\nRead: .factory/reviews/builder-latest.md,\
      \ .factory/reviews/code-review.md, .factory/reviews/health-check.md, .factory/reviews/qa-synthesized.md,\
      \ .factory/strategy/current.md, .factory/strategy/user-intent.md\nWrite output\
      \ to: .factory/reviews/overwatch-latest.md"
    timeout_overwatch: '1800'
gate_overwatch:
  type: GateNode
  id: gate_overwatch
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - .factory/reviews/overwatch-latest.md
  - .factory/strategy/user-intent.md
  edges_out:
  - target: gate_doc_freshness
    condition: PROCEED
  - target: builder
    condition: RELOOP
  slots:
    gate_prompt_gate_overwatch: 'You are the CEO reviewing the Overwatch verification
      report for a new workflow.


      Read:

      - .factory/reviews/overwatch-latest.md — the Overwatch''s findings

      - .factory/strategy/user-intent.md — what the user asked for


      The Overwatch has verified whether everything the user asked for was actually
      built and tested with evidence.


      PROCEED if:

      - All user asks in the Intent Coverage table show Status = Covered

      - No unsupported claims in the Evidence Audit

      - All spot checks passed (especially workflow validate and SKILL.md existence)

      - The Overwatch verdict is PASS


      RELOOP to builder if:

      - Any user ask is missing or untested

      - There are unsupported QA claims (tests claimed to pass without evidence)

      - Spot checks failed (workflow doesn''t validate, SKILL.md missing, mode not
      in registry)

      - The Overwatch verdict is FAIL


      When relooping, include the specific Overwatch findings in your feedback:

      - Which user asks are missing

      - Which claims lack evidence

      - Which spot checks failed and what the output was


      The builder will fix the issues and the full QA + Overwatch pipeline will re-run.'
    max_iterations_gate_overwatch: '3'
gate_doc_freshness:
  type: GateNode
  id: gate_doc_freshness
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - .factory/reviews/qa-synthesized.md
  edges_out:
  - target: gate_precheck
    condition: PROCEED
  - target: builder
    condition: RELOOP
  slots:
    gate_prompt_gate_doc_freshness: Check the PR diff for documentation freshness.
      If public APIs, CLI commands, configuration options, or architecture were changed
      or added, corresponding documentation (README.md, CLAUDE.md, docstrings, --help
      text, or doc/ files) MUST be updated. PROCEED if docs are current or no doc-worthy
      changes exist. RELOOP to builder if documentation is stale — specify exactly
      which changes need doc updates.
    max_iterations_gate_doc_freshness: '3'
gate_precheck:
  type: GateNode
  id: gate_precheck
  evaluator_type: fn
  evaluator_command: factory precheck {project_path} --score-before 0 --score-after
    0
  reads:
  - .factory/reviews/qa-synthesized.md
  edges_out:
  - target: archivist_build
    condition: PROCEED
  - target: archivist_build
    condition: HALT
archivist_build:
  type: AgentNode
  id: archivist_build
  role: archivist
  blocking: 'false'
  reads:
  - .factory/reviews/qa-synthesized.md
  writes:
  - .factory/archive/create-build.md
  edges_out: []
  slots:
    task_prompt_archivist_build: 'Archive the new mode build results and learnings.

      Read: .factory/reviews/qa-synthesized.md

      Write output to: .factory/archive/create-build.md'
    timeout_archivist_build: '300'
