[project]
name = "flyecon"
version = "0.1.0"
description = "Drosophila MaleCNS v1.0 connectome makes CS MR12 economy decisions"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "plotly>=5.18",
    "jinja2>=3.1",
    "structlog>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
